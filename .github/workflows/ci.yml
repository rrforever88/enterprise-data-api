name: CI

on:
    push:
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest

        env:
          DATABASE_URL: postgresql://appuser:apppassword@localhost:5432/enterprise_data_test

        services:
          postgres:
            image: postgres:17
            env:
              POSTGRES_USER: appuser
              POSTGRES_PASSWORD: apppassword
              POSTGRES_DB: enterprise_data_test
            ports:
                - 5432:5432
            options: >-
                --health-cmd "pg_isready -U appuser -d enterprise_data_test"
                --health-interval 5s
                --health-timeout 5s
                --health-retries 5

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.13"

            - name: Install dependencies
              run: python -m pip install ".[dev]"

            - name: Run migration
              run: python -m alembic upgrade head

            - name: Run test
              run: python -m pytest
